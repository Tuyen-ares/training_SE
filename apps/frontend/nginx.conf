# Nginx cho frontend BigIn (SPA + proxy API khi chạy cùng compose).
server {
  listen 80;
  root /usr/share/nginx/html;

  # SPA fallback theo apps/frontend/vercel.json: mọi deep link
  # (/assets/:id, /qr/:qrCode) đều về index.html, không 404.
  location / {
    try_files $uri /index.html;
  }

  # Khi chạy trong compose, /api/* proxy sang container backend tên "api".
  # Dùng biến + resolver để nginx BOOT được cả khi chạy lẻ (không có host
  # "api"): lúc đó / vẫn serve bình thường, chỉ /api/* trả 502.
  # 127.0.0.11 là DNS nhúng của Docker (có trong compose network).
  location /api/ {
    resolver 127.0.0.11 valid=30s;
    set $api http://api:3000;
    proxy_pass $api;
    proxy_set_header Host $host;
  }
}

            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /borrow-requests/{requestId}/approve-all:
    post:
      tags:
        - F04 - Approval & Reservation
      summary: Duyệt tất cả detail đủ điều kiện
      description: >-
        Xử lý mọi detail pending bằng cùng transaction atomic như duyệt từng detail. Detail đủ điều kiện
        thành `APPROVED`; xung đột giữ nguyên `PENDING`. Response chứa mảng `approved` và `skipped` để
        client hiển thị partial success.
      operationId: approveAllBorrowRequest
      parameters:
        - $ref: '#/components/parameters/RequestId'

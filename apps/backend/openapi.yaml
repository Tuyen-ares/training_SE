openapi: 3.0.3
info:
  title: BigIn Asset API
  description: >-
    API quản lý tài sản BigIn Asset. Bao gồm xác thực (F01), quản lý tài sản (F02),
    phiếu mượn (F03), duyệt & giữ chỗ (F04), bàn giao/hoàn trả/lịch sử mượn (F05),
    sự cố & sửa chữa (F06), thông báo (F07) và quản trị người dùng/phân quyền (F08).

    Quy ước chung:
    - Envelope thành công: `{ "data": ... }`.
    - Envelope lỗi: `{ "error": string, "details"?: object }`.
    - Danh sách: `page=1`, `pageSize=20` (tối đa 100); page DTO `{ items, page, pageSize, total }`.
    - Danh sách sắp xếp mới nhất trước; Review Queue sắp xếp cũ nhất trước.
    - `expectedReturnDate` chỉ ngày `YYYY-MM-DD` theo múi giờ `Asia/Ho_Chi_Minh`, phải từ hôm nay trở đi.
    - Authorization theo effective permission code (không kiểm tra tên role).
    - Lỗi dự kiến: `400` input sai, `401` chưa xác thực, `403` thiếu quyền, `404` không tìm thấy, `409` xung đột trạng thái/dữ liệu.
  version: 1.0.0
  contact:
    name: BigIn SE Team
servers:
  - url: http://localhost:3000/api
    description: Local development server
tags:
  - name: F01 - Authentication
    description: Xác thực và truy cập
  - name: F02 - Asset Management
    description: Quản lý tài sản, danh mục hãng/loại/model
  - name: F03 - Borrow Request
    description: Yêu cầu mượn tài sản
  - name: F04 - Approval & Reservation
    description: Duyệt và giữ chỗ tài sản
  - name: F05 - Handover, Return & History
    description: Bàn giao, hoàn trả và lịch sử mượn
  - name: F06 - Asset Issues & Repair
    description: Sự cố và sửa chữa tài sản
  - name: F07 - Notifications
    description: Thông báo
  - name: F08 - Administration
    description: Quản trị người dùng, phân quyền và phòng ban
  - name: Vendor Management
    description: Quản lý shared vendor master dùng cho repair và các workflow tài sản mở rộng
paths:
  /registration-requests:
    post:
      tags: [F01 - Authentication]
      summary: Gửi yêu cầu đăng ký
      operationId: submitRegistrationRequest
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationSubmitInput'
      responses:
        '201':
          description: Request PENDING đã được tạo; không tạo user hoặc session
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RegistrationSubmission'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Email/phone đã thuộc user hoặc một request PENDING khác
    get:
      tags: [F08 - Administration]
      summary: Danh sách yêu cầu đăng ký
      operationId: listRegistrationRequests
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, APPROVED, REJECTED], default: PENDING }
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Trang registration requests; yêu cầu `user_registration.review`
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RegistrationRequestPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /registration-requests/{requestId}:
    get:
      tags: [F08 - Administration]
      summary: Chi tiết yêu cầu đăng ký
      operationId: getRegistrationRequest
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Chi tiết request; yêu cầu `user_registration.review`
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/RegistrationRequest' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Không tìm thấy request }
  /registration-requests/{requestId}/approve:
    post:
      tags: [F08 - Administration]
      summary: Duyệt và tạo user
      description: Tạo user/userCode, department, initial roles, link createdUserId và clear hash trong một transaction.
      operationId: approveRegistrationRequest
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationApproveInput' }
      responses:
        '200':
          description: Request APPROVED; yêu cầu `user_registration.review`
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/RegistrationRequest' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Không tìm thấy request }
        '409': { description: Request đã review hoặc email/phone đã thuộc user; transaction rollback }
  /registration-requests/{requestId}/reject:
    post:
      tags: [F08 - Administration]
      summary: Từ chối yêu cầu đăng ký
      description: Rejection reason optional; password hash và pending keys luôn được clear.
      operationId: rejectRegistrationRequest
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationRejectInput' }
      responses:
        '200':
          description: Request REJECTED; yêu cầu `user_registration.review`
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Không tìm thấy request }
        '409': { description: Request đã được review }
  /auth/login:
    post:
      tags:
        - F01 - Authentication
      summary: Đăng nhập
      description: >-
        Xác thực user active và cấp phiên. Refresh token được đặt trong httpOnly cookie
        `refreshToken` (path `/api/auth`).
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Email hoặc mật khẩu không đúng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/refresh:
    post:
      tags:
        - F01 - Authentication
      summary: Làm mới phiên
      description: >-
        Trao đổi refresh token hợp lệ (từ cookie) để nhận phiên mới. Access token không được dùng ở endpoint này.
      operationId: refresh
      security: []
      responses:
        '200':
          description: Phiên mới
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LoginResult'
        '401':
          description: Refresh token thiếu hoặc không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      tags:
        - F01 - Authentication
      summary: Đăng xuất
      description: Thu hồi khả năng refresh của phiên hiện tại dựa trên cookie.
      operationId: logout
      security: []
      responses:
        '204':
          description: Đăng xuất thành công, không có nội dung trả về
  /assets:
    get:
      tags:
        - F02 - Asset Management
      summary: Danh sách tài sản
      description: Tìm kiếm, lọc và phân trang tài sản. Sắp xếp mới nhất trước.
      operationId: listAssets
      parameters:
        - name: q
          in: query
          description: Tìm kiếm không phân biệt hoa thường theo asset code, QR code, số serial và tên model. Chuỗi rỗng bị bỏ qua.
          schema:
            type: string
        - name: status
          in: query
          description: Lọc theo trạng thái tài sản
          schema:
            $ref: '#/components/schemas/AssetStatus'
        - name: modelId
          in: query
          schema:
            type: integer
            minimum: 1
        - name: typeId
          in: query
          schema:
            type: integer
            minimum: 1
        - name: brandId
          in: query
          schema:
            type: integer
            minimum: 1
        - name: departmentId
          in: query
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Danh sách tài sản
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AssetListPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - F02 - Asset Management
      summary: Tạo tài sản
      description: >-
        Thêm tài sản với dữ liệu nhận diện và model hợp lệ. Server tự sinh `assetCode` bất biến
        theo prefix normalized của asset type, tự sinh `qrCode` (UUID), và luôn đặt trạng thái
        ban đầu `AVAILABLE`. `assetCode`, `qrCode` và `status` không được gửi lên.
      operationId: createAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssetInput'
      responses:
        '201':
          description: Tạo tài sản thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AssetMutation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Serial trùng hoặc model/department không tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /assets/{id}:
    get:
      tags:
        - F02 - Asset Management
      summary: Chi tiết tài sản
      description: Xem chi tiết asset và danh sách action được phép.
      operationId: getAsset
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: Chi tiết tài sản
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AssetDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Tài sản không tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
        - F02 - Asset Management
      summary: Cập nhật tài sản
      description: >-
        Cập nhật thông tin được phép sửa. Yêu cầu ít nhất một trường. `assetCode`, `status`, `qrCode`, `id`
        và trường lạ bị từ chối với `400`.
      operationId: updateAsset
      parameters:
        - $ref: '#/components/parameters/AssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssetInput'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AssetMutation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Tài sản không tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Serial trùng hoặc model/department không tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /assets/{id}/report-damaged:
    post:
      tags:
        - F06 - Asset Issues & Repair
      summary: Báo sự cố tài sản
      description: >-
        Tạo issue `REPORTED` mà không thay đổi trạng thái asset. Chỉ cần xác thực (không cần
        quyền tĩnh) vì người đang mượn cũng đủ điều kiện. Tên path giữ nguyên vì lý do tương thích.
      operationId: reportDamaged
      parameters:
        - $ref: '#/components/parameters/AssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportIssueInput'
      responses:
        '201':
          description: Tạo báo cáo sự cố thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AssetIssue'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Người dùng đã xác thực nhưng không đủ điều kiện báo cáo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Tài sản không tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /assets/by-qr/{qrCode}:
    get:
      tags:
        - F02 - Asset Management
      summary: Tra cứu tài sản bằng QR
      description: >-
        Tra QR để mở chi tiết asset. QR được in dưới dạng frontend URL
        `{VITE_PUBLIC_APP_URL}/qr/{qr_code}`; màn hình scanner trích xuất mã
        `qr_code` rồi gọi API này. Chỉ đọc: không tạo bản ghi kiểm kê và không
        đổi trạng thái asset.
      operationId: getAssetByQr
      parameters:
        - name: qrCode
          in: path
          required: true
          description: Mã QR đã được trích xuất từ frontend QR URL và đã được trim
          schema:
            type: string
            maxLength: 36
      responses:
        '200':
          description: Chi tiết tài sản
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AssetDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Không tìm thấy QR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /assets/{id}/retire:
    post:
      tags:
        - F02 - Asset Management
      summary: Ngừng sử dụng tài sản
      description: >-
        Chuyển trạng thái tài sản sang `RETIRED`. Chỉ cho phép từ `AVAILABLE`, `DAMAGED`, `IN_REPAIR`.
        Từ `RESERVED`, `BORROWED`, `RETIRED` trả về `409`. Đây là chuyển trạng thái, không phải xóa bản ghi.
      operationId: retireAsset
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '204':
          description: Ngừng sử dụng thành công
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Tài sản không tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Trạng thái không cho phép ngừng sử dụng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /brands:
    get:
      tags:
        - F02 - Asset Management
      summary: Danh sách hãng
      operationId: listBrands
      responses:
        '200':
          description: Danh sách hãng
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Reference'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - F02 - Asset Management
      summary: Tạo hãng
      operationId: createBrand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferenceInput'
      responses:
        '201':
          description: Tạo hãng thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Reference'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Tên hãng đã tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /brands/{id}:
    get:
      tags:
        - F02 - Asset Management
      summary: Chi tiết hãng
      operationId: getBrand
      parameters:
        - $ref: '#/components/parameters/ReferenceId'
      responses:
        '200':
          description: Chi tiết hãng
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Reference'
        '404':
          description: Hãng không tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
        - F02 - Asset Management
      summary: Cập nhật hãng
      operationId: updateBrand
      parameters:
        - $ref: '#/components/parameters/ReferenceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferenceUpdateInput'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Reference'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Hãng không tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Tên hãng đã tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /asset-types:
    get:
      tags:
        - F02 - Asset Management
      summary: Danh sách loại thiết bị
      operationId: listAssetTypes
      responses:
        '200':
          description: Danh sách loại thiết bị
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Reference'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - F02 - Asset Management
      summary: Tạo loại thiết bị
      description: >-
        Server chuẩn hóa `name` thành prefix nội bộ A-Z/0-9 (tối đa 30 ký tự) để cấp asset code.
        Prefix rỗng trả `400`; name hoặc prefix đã tồn tại trả `409`. Prefix không là request field.
      operationId: createAssetType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferenceInput'
      responses:
        '201':
          description: Tạo loại thiết bị thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Reference'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Tên hoặc code prefix chuẩn hóa đã tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /asset-types/{id}:
    get:
      tags:
        - F02 - Asset Management
      summary: Chi tiết loại thiết bị
      operationId: getAssetType
      parameters:
        - $ref: '#/components/parameters/ReferenceId'
      responses:
        '200':
          description: Chi tiết loại thiết bị
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Reference'
        '404':
          description: Không tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
        - F02 - Asset Management
      summary: Cập nhật loại thiết bị
      description: >-
        Đổi tên cũng đổi prefix nội bộ trong cùng transaction. Asset code đã cấp giữ nguyên;
        prefix mới bắt đầu sequence riêng và prefix cũ giữ sequence của nó.
      operationId: updateAssetType
      parameters:
        - $ref: '#/components/parameters/ReferenceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferenceUpdateInput'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Reference'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Không tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Tên hoặc code prefix chuẩn hóa đã tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /asset-models:
    get:
      tags:
        - F02 - Asset Management
      summary: Danh sách model thiết bị
      description: Danh sách model cùng hãng và loại.

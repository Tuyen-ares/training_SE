      description: Yêu cầu `role.update`; rollback nếu vi phạm essential-admin invariant.
      operationId: replaceRolePermissions
      parameters:
        - name: roleId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceRolePermissionsInput' }
      responses:
        '200': { description: Permission set đã thay thế }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Không tìm thấy role }
        '409': { description: Mutation sẽ làm mất essential administration access }
  /rbac/permissions:
    get:
      tags: [F08 - Administration]
      summary: Danh sách permission read-only
      description: Yêu cầu `permission.view`; không có permission write API.
      operationId: listPermissions
      responses:
        '200':
          description: Permission codes và English descriptions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Permission' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /rbac/users/{userId}/roles:
    put:
      tags:
        - F08 - Administration
      summary: Thay thế role của người dùng
      description: Thay thế danh sách role cố định của user.
      operationId: replaceUserRoles
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceUserRolesInput'
      responses:
        '200':
          description: Cập nhật role thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Không tìm thấy người dùng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Mutation sẽ làm mất essential administration access
  /departments:
    get:
      tags:
        - F08 - Administration
      summary: Danh sách phòng ban
      description: Liệt kê department active/inactive; yêu cầu `department.view` hoặc `user_registration.review`.
      operationId: listDepartments
      responses:
        '200':
          description: Danh sách phòng ban
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - F08 - Administration
      summary: Tạo phòng ban
      description: Tạo department active; yêu cầu `department.create`.
      operationId: createDepartment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferenceInput'
      responses:
        '201':
          description: Tạo phòng ban thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Department'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Tên phòng ban đã tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /departments/{id}:
    get:
      tags:
        - F08 - Administration
      summary: Chi tiết phòng ban
      description: Trả department theo ID; yêu cầu `department.view`.
      operationId: getDepartment
      parameters:
        - $ref: '#/components/parameters/ReferenceId'
      responses:
        '200':
          description: Chi tiết phòng ban
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Không tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
        - F08 - Administration
      summary: Cập nhật phòng ban
      description: Chỉ sửa tên department bằng `department.update`; gửi `isActive` bị từ chối. Status dùng endpoint riêng.
      operationId: updateDepartment
      parameters:
        - $ref: '#/components/parameters/ReferenceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferenceUpdateInput'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Department'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Không tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Tên phòng ban đã tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /departments/{id}/status:
    patch:
      tags:
        - F08 - Administration
      summary: Kích hoạt/vô hiệu hóa phòng ban
      description: Gửi `isActive` để bật/tắt department; yêu cầu `department.manage_status`. Department inactive giữ liên kết/history nhưng không được gán mới.
      operationId: updateDepartmentStatus
      parameters:
        - $ref: '#/components/parameters/ReferenceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusInput'
      responses:
        '200':
          description: Department sau khi thay đổi trạng thái
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Department'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Không tìm thấy department, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AssetId:
      name: id
      in: path
      required: true
      description: ID tài sản
      schema:
        type: integer
        minimum: 1
    ReferenceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    DetailId:
      name: detailId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    IssueId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    VendorId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Page:
      name: page
      in: query
      description: Số trang, bắt đầu từ 1
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Số bản ghi mỗi trang, tối đa 100
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    HistoryState:
      name: state
      in: query
      description: Lọc trạng thái lịch sử mượn
      schema:
        type: string
        enum:
          - ALL
          - CURRENT
          - RETURNED
  responses:
    BadRequest:
      description: Dữ liệu đầu vào không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Chưa xác thực hoặc token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Thiếu quyền thực hiện thao tác
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        details:
          type: object
          additionalProperties: true
      required:
        - error
    MessageResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            message:
              type: string
          required:
            - message
      required:
        - data
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 40
        password:
          type: string
          minLength: 1
          maxLength: 72
      required:
        - email
        - password
      additionalProperties: false
    AuthenticatedUser:
      type: object
      properties:
        id:
          type: integer
        userCode:
          type: string
          pattern: '^BI[0-9]{5,}$'
          description: Mã user bất biến, được cấp theo năm account tạo.
        name:
          type: string
        avatarUrl:
          type: string
          format: uri
          nullable: true
        email:
          type: string
          format: email
        phone:
          type: string
        departmentId:
          type: integer
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Reference'
        permissionCodes:
          type: array
          items:
            type: string
      required:
        - id
        - userCode
        - name
        - email
        - phone
        - departmentId
        - roles
        - permissionCodes
    LoginResult:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token dùng cho Authorization header
        user:
          $ref: '#/components/schemas/AuthenticatedUser'
      required:
        - accessToken
        - user
    Reference:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
        - id
        - name
    Department:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, minLength: 1, maxLength: 30 }
        isActive: { type: boolean }
      required: [id, name, isActive]
    ReferenceInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
      required:
        - name
      additionalProperties: false
    ReferenceUpdateInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
      required:
        - name
      additionalProperties: false
    AssetModel:
      type: object
      properties:
        id:
          type: integer
        brandId:
          type: integer
        assetTypeId:
          type: integer
        name:
          type: string
      required:
        - id
        - brandId
        - assetTypeId
        - name
    AssetModelInput:
      type: object
      properties:
        brandId:
          type: integer
          minimum: 1
        assetTypeId:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 30
      required:
        - brandId
        - assetTypeId
        - name
      additionalProperties: false
    AssetModelUpdateInput:
      type: object
      properties:
        brandId:
          type: integer
          minimum: 1
        assetTypeId:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 30
      additionalProperties: false
    AssetStatus:
      type: string
      enum:
        - AVAILABLE
        - RESERVED
        - BORROWED
        - DAMAGED
        - IN_REPAIR
        - RETIRED
    CreateAssetInput:
      type: object
      properties:
        assetModelId:
          type: integer
          minimum: 1
        serialNumber:
          type: string
          minLength: 1
          maxLength: 100
          nullable: true
        imageUrl:
          type: string
          format: uri
          maxLength: 500
          nullable: true
        departmentId:
          type: integer
          minimum: 1
          nullable: true
      required:
        - assetModelId
      additionalProperties: false
    UpdateAssetInput:
      type: object
      properties:
        assetModelId:
          type: integer
          minimum: 1
        serialNumber:
          type: string
          minLength: 1
          maxLength: 100
          nullable: true
        imageUrl:
          type: string
          format: uri
          maxLength: 500
          nullable: true
        departmentId:
          type: integer
          minimum: 1
          nullable: true
      additionalProperties: false
    AssetSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
        - id
        - name
    AssetListItem:
      type: object
      properties:
        id:
          type: integer
        assetCode:
          type: string
          maxLength: 64
        serialNumber:
          type: string
          nullable: true
        qrCode:
          type: string
        imageUrl:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/AssetStatus'
        model:
          $ref: '#/components/schemas/AssetSummary'
        brand:
          $ref: '#/components/schemas/AssetSummary'
        type:
          $ref: '#/components/schemas/AssetSummary'
        department:
          allOf:
            - $ref: '#/components/schemas/AssetSummary'
          nullable: true
      required:
        - id
        - assetCode
        - serialNumber
        - qrCode
        - status
        - model
        - brand
        - type
    AssetListPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AssetListItem'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
      required:
        - items
        - page
        - pageSize
        - total
    AssetDetail:
      allOf:
        - $ref: '#/components/schemas/AssetListItem'
        - type: object
          properties:
            actions:
              type: object
              properties:
                canReportIssue:
                  type: boolean
              required:
                - canReportIssue
          required:
            - actions
    AssetMutation:
      type: object
      properties:
        id:
          type: integer
        assetCode:
          type: string
          maxLength: 64
        assetModelId:
          type: integer
        serialNumber:
          type: string
          nullable: true
        qrCode:
          type: string
        status:
          $ref: '#/components/schemas/AssetStatus'
        imageUrl:
          type: string
          nullable: true
        departmentId:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - assetCode
        - assetModelId
        - serialNumber
        - qrCode
        - status
        - createdAt
    ReportIssueInput:
      type: object
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 1000
      required:
        - description
      additionalProperties: false
    BorrowRequestStatus:
      type: string
      enum:
        - PENDING
        - APPROVED
        - REJECTED
        - PARTIALLY_APPROVED
        - COMPLETED
        - CANCELLED
    BorrowDetailStatus:
      type: string
      enum:
        - PENDING
        - APPROVED
        - REJECTED
    CreateBorrowRequestInput:
      type: object
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 300
        items:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              assetId:
                type: integer
                minimum: 1
              expectedReturnDate:
                type: string
                format: date
                description: YYYY-MM-DD, từ hôm nay trở đi (Asia/Ho_Chi_Minh)
            required:
              - assetId
              - expectedReturnDate
            additionalProperties: false
      required:
        - note
        - items
      additionalProperties: false
    BorrowRequest:
      type: object
      properties:
        id:
          type: integer
        requester:
          type: object
          properties:
            id:
              type: integer
            userCode:
              type: string
              pattern: '^BI[0-9]{5,}$'
            name:
              type: string
            avatarUrl:
              type: string
              nullable: true
          required:
            - id
            - userCode
            - name
        status:
          $ref: '#/components/schemas/BorrowRequestStatus'
        note:
          type: string
          maxLength: 300
        createdAt:
          type: string
          format: date-time
        details:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              asset:
                type: object
                properties:
                  id:
                    type: integer
                  serialNumber:
                    type: string
                    nullable: true
                  qrCode:
                    type: string
                  imageUrl:
                    type: string
                    nullable: true
                  status:
                    $ref: '#/components/schemas/AssetStatus'
                  model:
                    $ref: '#/components/schemas/AssetSummary'
                required:
                  - id
                  - qrCode
                  - status
                  - model
              expectedReturnDate:
                type: string
                format: date
              approvalStatus:
                $ref: '#/components/schemas/BorrowDetailStatus'
              approvedBy:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                required:
                  - id
                  - name
                nullable: true
              approvedAt:
                type: string
                format: date-time
                nullable: true
              rejectionReason:
                type: string
                maxLength: 300
                nullable: true
            required:
              - id
              - asset
              - expectedReturnDate
              - approvalStatus
          required:
            - id
            - requester
            - status
            - createdAt
            - details
      required:
        - id
        - requester
        - status
        - createdAt
        - details
    BorrowRequestListItem:
      type: object
      properties:
        id:
          type: integer
        status:
          $ref: '#/components/schemas/BorrowRequestStatus'
        createdAt:
          type: string
          format: date-time
        detailCount:
          type: integer
        pendingCount:
          type: integer
        approvedCount:
          type: integer
        rejectedCount:
          type: integer
      required:
        - id
        - status
        - createdAt
        - detailCount
        - pendingCount
        - approvedCount
        - rejectedCount
    BorrowRequestPage:
      type: object
      properties:
        items:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/BorrowRequestListItem'
              - $ref: '#/components/schemas/BorrowRequest'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
      required:
        - items
        - page
        - pageSize
        - total
    ApprovalResult:
      type: object
      properties:
        detailId:
          type: integer
        approvalStatus:
          $ref: '#/components/schemas/BorrowDetailStatus'
      required:
        - detailId
        - approvalStatus
    RejectDetailInput:
      type: object
      properties:
        rejectionReason:
          type: string
          minLength: 1
          maxLength: 300
      required:
        - rejectionReason
      additionalProperties: false
    ApproveAllResult:
      type: object
      properties:
        requestId:
          type: integer
        approved:
          type: array
          items:
            type: object
            properties:
              detailId:
                type: integer
              approvalStatus:
                type: string
                enum:
                  - APPROVED
            required:
              - detailId
              - approvalStatus
        skipped:
          type: array
          items:
            type: object
            properties:
              detailId:
                type: integer
              approvalStatus:
                type: string
                enum:
                  - PENDING
              reason:
                type: string
                enum:
                  - ASSET_NOT_AVAILABLE
                  - DETAIL_NOT_PENDING
            required:
              - detailId
              - approvalStatus
              - reason
      required:
        - requestId
        - approved
        - skipped
    CancelResult:
      type: object
      properties:
        requestId:
          type: integer
        status:
          type: string
          enum:
            - CANCELLED
      required:
        - requestId
        - status
    HandoverResult:
      type: object
      properties:
        historyId:
          type: integer
      required:
        - historyId
    HandoverQueueItem:
      type: object
      properties:
        detailId:
          type: integer
        requestId:
          type: integer
        requestCreatedAt:
          type: string
          format: date-time
        requester:
          type: object
          properties:
            id:
              type: integer
            userCode:
              type: string
              pattern: '^BI[0-9]{5,}$'
            name:
              type: string
            email:
              type: string
              format: email
            avatarUrl:
              type: string
              nullable: true
            department:
              type: object
              nullable: true
              properties:
                id:
                  type: integer
                name:
                  type: string
              required:
                - id
                - name
          required:
            - id
            - userCode
            - name
            - email
            - avatarUrl
            - department
        asset:
          type: object
          properties:
            id:
              type: integer
            serialNumber:
              type: string
              nullable: true
            qrCode:
              type: string
            imageUrl:
              type: string
              nullable: true
            status:
              $ref: '#/components/schemas/AssetStatus'
            model:
              $ref: '#/components/schemas/AssetSummary'
          required:
            - id
            - serialNumber
            - qrCode
            - imageUrl
            - status
            - model
        expectedReturnDate:
          type: string
          format: date
        approvedBy:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string
          required:
            - id
            - name
        approvedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - detailId
        - requestId
        - requestCreatedAt
        - requester
        - asset
        - expectedReturnDate
        - approvedBy
        - approvedAt
    HandoverQueuePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HandoverQueueItem'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
      required:
        - items
        - page
        - pageSize
        - total
    ReturnResult:
      type: object
      properties:
        historyId:
          type: integer
        returned:
          type: boolean
      required:
        - historyId
        - returned
    DamagedReturnInput:
      type: object
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 1000
      required:
        - description
      additionalProperties: false
    DamagedReturnResult:
      type: object
      properties:
        historyId:
          type: integer
        returned:
          type: boolean
        returnCondition:
          type: string
          enum:
            - DAMAGED
        issueId:
          type: integer
      required:
        - historyId
        - returned
        - returnCondition
        - issueId
    BorrowHistory:
      type: object
      properties:
        id:
          type: integer
        detailId:
          type: integer
        asset:
          type: object
          properties:
            id:
              type: integer
            serialNumber:
              type: string
              nullable: true
            qrCode:
              type: string
            status:
              $ref: '#/components/schemas/AssetStatus'
            model:
              $ref: '#/components/schemas/AssetSummary'
          required:
            - id
            - qrCode
            - status
            - model
        borrower:
          type: object
          properties:
            id:
              type: integer
            userCode:
              type: string
              pattern: '^BI[0-9]{5,}$'
            name:
              type: string
            avatarUrl:
              type: string
              nullable: true
          required:
            - id
            - userCode
            - name
        expectedReturnDate:
          type: string

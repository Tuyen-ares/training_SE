          schema:
            $ref: '#/components/schemas/BorrowDetailStatus'
      responses:
        '200':
          description: Trang hàng đợi duyệt
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BorrowRequestPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /borrow-request-details/review-queue/{requestId}:

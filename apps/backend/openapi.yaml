      operationId: listRoles
      responses:
        '200':
          description: Danh sách role
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RoleSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [F08 - Administration]
      summary: Tạo custom role
      description: Yêu cầu `role.create`; permission set phải có ít nhất một phần tử.
      operationId: createRole
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoleInput' }
      responses:
        '201':
          description: Role đã tạo
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/RoleDetail' } }

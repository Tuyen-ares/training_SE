      summary: Hàng đợi bàn giao
      description: >-
        Yêu cầu permission `asset.checkout`. Chỉ trả về detail `APPROVED` có asset
        `RESERVED` và chưa có borrow history; không yêu cầu `borrow_request.view_all`
        hoặc `borrow_history.view_all`. Sắp xếp request cũ trước, sau đó `detailId`
        tăng dần.
      operationId: listHandoverQueue
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Trang hàng đợi bàn giao
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/HandoverQueuePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /borrow-request-details/review-queue:
    get:
      tags:
        - F04 - Approval & Reservation
      summary: Hàng đợi duyệt
      description: >-
        Trang toàn công ty chứa các phiếu có ít nhất một detail `PENDING`, sắp xếp cũ nhất trước.

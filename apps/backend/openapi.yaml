  /vendors:
    get:
      tags: [Vendor Management]
      summary: Danh sách vendor
      description: Tìm kiếm, phân trang và lọc vendor theo trạng thái. Yêu cầu `vendor.view`.
      operationId: listVendors
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 255 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: isActive
          in: query
          description: true chỉ vendor active; false chỉ inactive; bỏ trống là tất cả
          schema: { type: boolean }
      responses:
        '200':
          description: Trang vendor
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/VendorPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Vendor Management]
      summary: Tạo vendor
      description: Tạo vendor active; yêu cầu `vendor.create`. Chuỗi contact rỗng được lưu thành null.
      operationId: createVendor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VendorWriteInput' }
      responses:
        '201':
          description: Vendor đã tạo
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Vendor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Tên vendor đã tồn tại, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /vendors/{id}:
    get:
      tags: [Vendor Management]
      summary: Chi tiết vendor
      description: Trả contact data; yêu cầu `vendor.view`.
      operationId: getVendor
      parameters:
        - $ref: '#/components/parameters/VendorId'
      responses:
        '200':
          description: Vendor detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Vendor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Không tìm thấy vendor, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    patch:
      tags: [Vendor Management]
      summary: Cập nhật vendor
      description: Chỉ sửa thông tin vendor; yêu cầu `vendor.update`. Trạng thái được thay đổi qua endpoint status.
      operationId: updateVendor
      parameters:
        - $ref: '#/components/parameters/VendorId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VendorUpdateInput' }
      responses:
        '200':
          description: Vendor đã cập nhật
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Vendor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Không tìm thấy vendor, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Tên vendor đã tồn tại, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /vendors/{id}/status:
    patch:

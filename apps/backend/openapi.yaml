        '200':
          description: Kết quả duyệt từng detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ApproveAllResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Không tìm thấy phiếu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xử lý lại detail không còn pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /borrow-requests/{requestId}/cancel:
    post:
      tags:
        - F03 - Borrow Request
      summary: Thu hồi phiếu mượn
      description: >-
        Hủy phiếu của chủ sở hữu khi chưa có bàn giao xảy ra và giải phóng các asset đã được giữ chỗ.
      operationId: cancelBorrowRequest

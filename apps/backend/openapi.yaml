      description: Gửi `isActive` để bật/tắt vendor; yêu cầu `vendor.manage_status`. Vendor inactive vẫn giữ lịch sử.
      operationId: updateVendorStatus
      parameters:
        - $ref: '#/components/parameters/VendorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusInput'
      responses:
        '200':
          description: Vendor sau khi thay đổi trạng thái
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Vendor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Không tìm thấy vendor, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

                  data:
                    $ref: '#/components/schemas/ApprovalResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Không tìm thấy detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Detail không còn pending hoặc asset không available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /borrow-request-details/{detailId}/reject:
    post:
      tags:
        - F04 - Approval & Reservation
      summary: Từ chối một thiết bị trong phiếu
      description: >-
        Chỉ thay đổi detail pending, ghi lại reviewer/thời gian/lý do; trạng thái asset không đổi.
      operationId: rejectBorrowDetail
      parameters:
        - $ref: '#/components/parameters/DetailId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectDetailInput'
      responses:
        '200':
          description: Từ chối thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ApprovalResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Không tìm thấy detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Detail không còn pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /borrow-request-details/{detailId}/handover:
    post:
      tags:
        - F05 - Handover, Return & History
      summary: Xác nhận bàn giao
      description: >-
        Chuyển `RESERVED → BORROWED` và tạo đúng một lịch sử mượn với borrower là chủ phiếu.
        Request body rỗng.
      operationId: confirmHandover
      parameters:
        - $ref: '#/components/parameters/DetailId'
      responses:
        '200':
          description: Bàn giao thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/HandoverResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Không tìm thấy detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Detail không APPROVED hoặc asset không RESERVED, hoặc đã bàn giao
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /borrow-histories/current:
    get:
      tags:
        - F05 - Handover, Return & History
      summary: Tài sản đang mượn
      description: Danh sách tài sản chưa trả của user hiện tại.
      operationId: listCurrentBorrows
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Trang tài sản đang mượn
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BorrowHistoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /borrow-histories/me:
    get:
      tags:
        - F05 - Handover, Return & History
      summary: Lịch sử mượn của tôi
      description: Lịch sử mượn đã hoàn trả và chưa hoàn trả của user hiện tại.
      operationId: listMyBorrowHistory
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/HistoryState'
      responses:
        '200':
          description: Trang lịch sử mượn của user hiện tại
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BorrowHistoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /borrow-histories:
    get:
      tags:
        - F05 - Handover, Return & History
      summary: Toàn bộ lịch sử mượn
      description: Lịch sử mượn toàn công ty cho user có permission phù hợp.
      operationId: listAllBorrowHistory
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/HistoryState'
      responses:
        '200':
          description: Trang lịch sử mượn toàn công ty
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BorrowHistoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /borrow-histories/return-queue:
    get:
      tags:
        - F05 - Handover, Return & History
      summary: Hàng đợi nhận trả
      description: >-
        Yêu cầu permission `asset.checkin`. Chỉ trả về borrow history chưa có
        `return_date`; không yêu cầu `borrow_request.view_all` hoặc
        `borrow_history.view_all`. Sắp xếp theo expected return date gần nhất/quá
        hạn trước, rồi `borrowedAt` cũ trước và `historyId` tăng dần.
      operationId: listReturnQueue
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Trang hàng đợi nhận trả
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BorrowHistoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /borrow-histories/{historyId}:
    get:
      tags:
        - F05 - Handover, Return & History
      summary: Chi tiết lịch sử mượn
      description: >-
        Trả chi tiết history trong phạm vi effective permission. `borrow_history.view_own`
        chỉ đọc được history thuộc request của chính user; `borrow_history.view_all` đọc
        được history toàn công ty. Response gồm request reason, requester, approval,
        handover và return metadata đã ghi nhận.
      operationId: getBorrowHistoryDetail
      parameters:
        - name: historyId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Chi tiết lịch sử mượn
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BorrowHistoryDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Không tìm thấy lịch sử mượn trong phạm vi được phép
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /borrow-histories/{historyId}/return:
    post:
      tags:
        - F05 - Handover, Return & History
      summary: Xác nhận hoàn trả
      description: >-
        Ghi nhận người nhận/thời gian, ghi `returnCondition=NORMAL` canonical, chuyển asset
        `BORROWED → AVAILABLE`. Client không thể tự chọn tình trạng trả trong lượt trả bình thường.
      operationId: confirmReturn
      parameters:
        - name: historyId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Hoàn trả thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ReturnResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Không tìm thấy lịch sử mượn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Lịch sử đã trả hoặc asset không BORROWED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /borrow-histories/{historyId}/return-damaged:
    post:
      tags:
        - F05 - Handover, Return & History
      summary: Xác nhận trả thiết bị hỏng
      description: >-
        Atomic operation: ghi nhận history đã trả với `returnCondition=DAMAGED`, chuyển
        asset `BORROWED → DAMAGED`, tạo asset issue `CONFIRMED` và trả `issueId` của issue
        mới tạo. Nếu một bước lỗi, toàn bộ thay đổi rollback.
      operationId: confirmDamagedReturn
      parameters:
        - name: historyId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DamagedReturnInput'
      responses:
        '200':
          description: Trả thiết bị hỏng thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DamagedReturnResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Không tìm thấy lịch sử mượn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: History đã trả hoặc asset không còn BORROWED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /asset-issues:
    get:
      tags:
        - F06 - Asset Issues & Repair
      summary: Danh sách sự cố
      description: Tìm kiếm và lọc sự cố mà user được phép xem.
      operationId: listAssetIssues
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          description: Lọc theo trạng thái sự cố
          schema:
            $ref: '#/components/schemas/AssetIssueStatus'
        - name: assetId
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Trang sự cố
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AssetIssuePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /asset-issues/{id}:
    get:
      tags:
        - F06 - Asset Issues & Repair

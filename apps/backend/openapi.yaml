        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Tên role đã tồn tại }
  /rbac/roles/{roleId}:
    get:
      tags: [F08 - Administration]
      summary: Chi tiết role và permission set
      description: Yêu cầu `role.view`.
      operationId: getRole
      parameters:
        - name: roleId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Role detail
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/RoleDetail' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Không tìm thấy role }
    patch:
      tags: [F08 - Administration]
      summary: Đổi tên custom role
      description: Yêu cầu `role.update`; system role name được bảo vệ.
      operationId: updateRoleName
      parameters:
        - name: roleId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties: { name: { type: string, minLength: 1, maxLength: 30 } }
      responses:
        '200': { description: Role đã cập nhật }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Không tìm thấy role }
        '409': { description: System role hoặc duplicate name }
